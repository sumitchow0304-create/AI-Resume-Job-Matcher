<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Roles - ResumeAI</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body><nav class="nav"><a class="brand" href="/static/dashboard.html">Resume<span>AI</span></a><div class="navlinks"><a href="/static/dashboard.html">Dashboard</a><a class="active" href="/static/jobs.html">Job Roles</a><a href="/static/upload.html">Analyze Resume</a><a href="/static/history.html">History</a><button id="logout" class="linkbtn">Logout</button></div></nav>
<main class="container"><div class="page-head"><div><p class="eyebrow">PRIVATE JOB LIBRARY</p><h1>Job roles</h1><p class="muted">Only you can access these roles.</p></div></div>
<section class="panel"><h2 id="formTitle">Add a job role</h2><form id="jobForm" class="grid-form"><input type="hidden" id="jobId"><label>Job title<input id="title" required placeholder="Backend Developer"></label><label>Minimum experience (years)<input id="experience" type="number" min="0" step=".5" value="0"></label><label class="wide">Description<textarea id="description" placeholder="Responsibilities and role context..."></textarea></label><label>Required skills<textarea id="required" placeholder="Python, SQL, FastAPI, PostgreSQL"></textarea></label><label>Preferred skills<textarea id="preferred" placeholder="Docker, AWS"></textarea></label><label>Education<input id="education" placeholder="B.Tech / B.E. or equivalent"></label><div class="wide form-actions"><button class="btn primary">Save job role</button><button type="button" id="cancelEdit" class="btn ghost hidden">Cancel edit</button></div></form><p id="msg" class="message"></p></section>
<section class="panel"><div class="panel-head"><h2>Your roles</h2></div><div id="jobs" class="cards"></div></section></main>
<script src="/static/js/api.js"></script><script src="/static/js/jobs.js"></script></body></html>
