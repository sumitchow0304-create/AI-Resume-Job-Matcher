services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: resume_analyzer
      POSTGRES_USER: resume_admin
      POSTGRES_PASSWORD: resume_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_admin -d resume_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://resume_admin:resume_password@db:5432/resume_analyzer
      SECRET_KEY: change-this-in-production
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/uploads
volumes:
  pgdata:
